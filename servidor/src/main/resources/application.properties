# Configuración del servidor de Meet&Roll (se sube a GitHub: aquí no hay contraseñas).
# El usuario y la contraseña de la base de datos están en config/application.properties,
# que no se sube. Ver config/application.properties.example.

# Dirección de la base de datos: MySQL en este equipo, puerto 3306, base "meetroll".
spring.datasource.url=jdbc:mysql://localhost:3306/meetroll?serverTimezone=Europe/Madrid

# Hibernate comprueba al arrancar que las entidades coinciden con las tablas,
# pero nunca crea ni modifica tablas: las tablas se crean con servidor/sql/schema.sql.
spring.jpa.hibernate.ddl-auto=validate

# Cierra la conexión con la base de datos en cuanto el servicio termina su trabajo,
# en vez de mantenerla abierta mientras se envía la respuesta al cliente.
spring.jpa.open-in-view=false

# Muestra en la consola las consultas SQL que hace Hibernate (útil mientras se desarrolla).
spring.jpa.show-sql=true
